{% extends "base.html" %}
{% block content %}
<div class="card" style="max-width: 500px; margin: auto;">
    <h3>Editar Competição: {{ comp.nome }}</h3>
    <form method="POST">
        <label>Nome da Competição:</label>
        <input type="text" name="nome" value="{{ comp.nome }}" required>
        
        <label>Início:</label>
        <input type="datetime-local" name="inicio" value="{{ comp.inicio.strftime('%Y-%m-%dT%H:%M') }}" required>
        
        <label>Término:</label>
        <input type="datetime-local" name="termino" value="{{ comp.termino.strftime('%Y-%m-%dT%H:%M') }}" required>
        
        <button type="submit">Salvar Alterações</button>
        <a href="/admin" style="margin-left: 10px; color: red;">Cancelar</a>
    </form>
</div>
{% endblock %}
